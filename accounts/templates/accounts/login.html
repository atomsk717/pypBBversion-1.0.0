{% extends "forum/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Log in</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>

<p>Don't have an account? <a href="{% url 'accounts:register' %}">Register</a></p>
{% endblock %}
