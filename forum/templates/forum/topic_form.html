{% extends "forum/base.html" %}

{% block title %}New Topic in {{ forum.name }}{% endblock %}

{% block content %}
<nav class="breadcrumb">
    <a href="{% url 'forum:home' %}">Home</a> &raquo;
    <a href="{% url 'forum:forum_detail' forum.slug %}">{{ forum.name }}</a> &raquo;
    New Topic
</nav>

<h2>Create a new topic</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Topic</button>
</form>
{% endblock %}
